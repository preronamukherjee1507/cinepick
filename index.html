    /* Color Palette */
    :root {
      --navy: #2F4156;
      --teal: #567C8D;
      --sky-blue: #C8D9E6;
      --beige: #F5EFEB;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--beige);
      color: var(--navy);
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 3rem;
      color: var(--navy);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 1.2rem;
      color: var(--teal);
      font-style: italic;
    }

    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* 8 Bubble Options Layout */
    .bubble-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      margin-top: 25px;
    }

    .bubble {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      color: var(--white);
      font-family: 'Georgia', serif;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      box-shadow: 0 8px 15px rgba(47, 65, 86, 0.2), 
                  inset 0 6px 10px rgba(255, 255, 255, 0.4),
                  inset 0 -6px 10px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      animation: float 4s ease-in-out infinite alternate;
    }

    .bubble:hover {
      transform: scale(1.12) translateY(-5px);
      box-shadow: 0 12px 20px rgba(47, 65, 86, 0.3), 
                  inset 0 8px 12px rgba(255, 255, 255, 0.5),
                  inset 0 -6px 10px rgba(0, 0, 0, 0.2);
    }

    .bubble-navy { background-color: var(--navy); }
    .bubble-teal { background-color: var(--teal); }
    .bubble-sky { background-color: var(--sky-blue); color: var(--navy); }
    
    .bubble:nth-child(even) { animation-delay: 0.8s; }
    .bubble:nth-child(3n) { animation-delay: 1.6s; }
    .bubble:nth-child(5n) { animation-delay: 2.4s; }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }

    /* Shuffle Screen */
    .shuffle-box {
      font-size: 1.5rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px dashed var(--teal);
      border-radius: 50%;
      width: 240px;
      height: 240px;
      margin: 30px auto;
      background: var(--sky-blue);
      color: var(--navy);
      padding: 20px;
      box-shadow: 0 10px 20px rgba(47, 65, 86, 0.15);
    }

    .shuffling {
      animation: pulse 0.12s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.96); }
      100% { transform: scale(1.04); }
    }

    /* Movie Result Card */
    .result-card {
      background: var(--white);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(47, 65, 86, 0.15);
      text-align: left;
    }

    .result-card h2 {
      color: var(--navy);
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .movie-meta {
      color: var(--teal);
      font-weight: bold;
      margin-bottom: 15px;
    }

    .movie-desc {
      line-height: 1.6;
      color: var(--navy);
      margin-bottom: 20px;
    }

    .watch-box {
      background: var(--beige);
      padding: 12px 15px;
      border-radius: 10px;
      border-left: 4px solid var(--teal);
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    .btn {
      background: var(--navy);
      color: var(--white);
      border: none;
      padding: 14px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-family: 'Georgia', serif;
      font-size: 1rem;
      width: 100%;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: var(--teal);
    }
  </style>
</head>

        { title: "Hate Story", year: "2012", rating: "⭐️ 5.3", desc: "A woman plots to bring down a corrupt business tycoon who ruined her life.", watch: "ZEE5" },
        { title: "The Girl with Dragon Tattoo", year: "2011", rating: "⭐️ 7.8", desc: "A journalist and a hacker search for a woman missing for forty years.", watch: "Max" },

    };

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function selectGenre(genre) {
      showScreen('step-shuffle');
      const movies = movieData[genre];
      const shuffleBox = document.getElementById('shuffle-box');
      
      let counter = 0;
      const interval = setInterval(() => {
        const randomTemp = movies[Math.floor(Math.random() * movies.length)];
        shuffleBox.innerText = randomTemp.title;
        counter++;

        if (counter > 22) {
          clearInterval(interval);
          const selectedMovie = movies[Math.floor(Math.random() * movies.length)];
          shuffleBox.innerText = selectedMovie.title;
          
          setTimeout(() => {
            displayMovie(selectedMovie);
          }, 800);
        }
      }, 90);
    }

    function displayMovie(movie) {
      document.getElementById('movie-title').innerText = movie.title;
      document.getElementById('movie-meta').innerText = `${movie.year} • ${movie.rating}`;
      document.getElementById('movie-desc').innerText = movie.desc;
      document.getElementById('movie-platform').innerText = movie.watch;
      showScreen('step-result');
    }

    function resetApp() {
      showScreen('step-genre');
    }
  </script>
