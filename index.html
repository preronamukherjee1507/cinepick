<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinePick</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      max-width: 600px;
      width: 90%;
      padding: 30px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 30px;
    }

    .option-group {
      margin-bottom: 30px;
    }

    .option-group h3 {
      margin-bottom: 15px;
      color: #93c5fd;
    }

    /* Bubble Options Styling */
    .bubble-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .bubble-option input[type="radio"] {
      display: none;
    }

    .bubble-option label {
      display: inline-block;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px; /* Makes option buttons bubble-shaped */
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .bubble-option label:hover {
      background: rgba(59, 130, 246, 0.4);
      border-color: #60a5fa;
      transform: translateY(-2px);
    }

    .bubble-option input[type="radio"]:checked + label {
      background: #3b82f6;
      border-color: #93c5fd;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
      transform: scale(1.05);
    }

    /* Submit Button Styling */
    .submit-btn {
      margin-top: 20px;
      padding: 15px 40px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(90deg, #2563eb, #3b82f6);
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      background: linear-gradient(90deg, #1d4ed8, #2563eb);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>CinePick</h1>

    <!-- Form submits choices directly to results.html -->
    <form action="results.html" method="GET">
      
      <div class="option-group">
        <h3>Pick a Genre</h3>
        <div class="bubble-container">
          <div class="bubble-option">
            <input type="radio" id="romcom" name="genre" value="Rom-Com">
            <label for="romcom">Rom-Com</label>
          </div>
          <div class="bubble-option">
            <input type="radio" id="crime" name="genre" value="True Crime">
            <label for="crime">True Crime</label>
          </div>
          <div class="bubble-option">
            <input type="radio" id="drama" name="genre" value="Drama">
            <label for="drama">Drama</label>
          </div>
        </div>
      </div>

      <div class="option-group">
        <h3>Pick a Mood</h3>
        <div class="bubble-container">
          <div class="bubble-option">
            <input type="radio" id="cozy" name="mood" value="Cozy">
            <label for="cozy">Cozy</label>
          </div>
          <div class="bubble-option">
            <input type="radio" id="thrilling" name="mood" value="Thrilling">
            <label for="thrilling">Thrilling</label>
          </div>
          <div class="bubble-option">
            <input type="radio" id="lighthearted" name="mood" value="Lighthearted">
            <label for="lighthearted">Lighthearted</label>
          </div>
        </div>
      </div>

      <button type="submit" class="submit-btn">Find Movies</button>

    </form>
  </div>

</body>
</html>
