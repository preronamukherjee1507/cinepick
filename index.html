<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinePick | Find Your Next Flick</title>
  <style>
    /* Color Palette Variables */
    :root {
      --navy: #2F4156;
      --teal: #567C8D;
      --sky-blue: #C8D9E6;
      --beige: #F5EFEB;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--beige);
      color: var(--navy);
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 3rem;
      color: var(--navy);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 1.2rem;
      color: var(--teal);
      font-style: italic;
    }

    .container {
      width: 100%;
      max-width: 550px;
      text-align: center;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* Bubble Options Area */
    .bubble-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .bubble {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: none;
      color: var(--white);
      font-family: 'Georgia', serif;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      box-shadow: 0 8px 15px rgba(47, 65, 86, 0.2), 
                  inset 0 6px 10px rgba(255, 255, 255, 0.4),
                  inset 0 -6px 10px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      animation: float 4s ease-in-out infinite alternate;
    }

    .bubble:hover {
      transform: scale(1.1) translateY(-5px);
      box-shadow: 0 12px 20px rgba(47, 65, 86, 0.3), 
                  inset 0 8px 12px rgba(255, 255, 255, 0.5),
                  inset 0 -6px 10px rgba(0, 0, 0, 0.2);
    }

    /* Palette variations for bubbles */
    .bubble-navy { background-color: var(--navy); }
    .bubble-teal { background-color: var(--teal); }
    .bubble-sky { background-color: var(--sky-blue); color: var(--navy); }
    
    .bubble:nth-child(even) { animation-delay: 1s; }
    .bubble:nth-child(3n) { animation-delay: 2s; }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }

    /* Shuffle View */
    .shuffle-box {
      font-size: 1.8rem;
      font-weight: bold;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px dashed var(--teal);
      border-radius: 50%;
      width: 220px;
      height: 220px;
      margin: 30px auto;
      background: var(--sky-blue);
      color: var(--navy);
      box-shadow: 0 10px 20px rgba(47, 65, 86, 0.15);
    }

    .shuffling {
      animation: pulse 0.12s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.96); }
      100% { transform: scale(1.04); }
    }

    /* Movie Result Card */
    .result-card {
      background: var(--white);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(47, 65, 86, 0.15);
      text-align: left;
    }

    .result-card h2 {
      color: var(--navy);
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .movie-meta {
      color: var(--teal);
      font-weight: bold;
      margin-bottom: 15px;
    }

    .movie-desc {
      line-height: 1.6;
      color: var(--navy);
      margin-bottom: 20px;
    }

    .watch-box {
      background: var(--beige);
      padding: 12px 15px;
      border-radius: 10px;
      border-left: 4px solid var(--teal);
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    .btn {
      background: var(--navy);
      color: var(--white);
      border: none;
      padding: 14px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-family: 'Georgia', serif;
      font-size: 1rem;
      width: 100%;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: var(--teal);
    }
  </style>
</head>
<body>

  <header>
    <h1>CinePick</h1>
    <p>Find Your Next Flick</p>
  </header>

  <div class="container">
    <!-- Step 1: Bubbles -->
    <div id="step-genre" class="screen active">
      <h2 style="font-size: 1.4rem; color: var(--navy);">CHOOSE YOUR MOVIE TYPE</h2>
      <div class="bubble-container">
        <button class="bubble bubble-teal" onclick="selectGenre('Romcom')">Romcom</button>
        <button class="bubble bubble-navy" onclick="selectGenre('Sci-Fi')">Sci-Fi</button>
        <button class="bubble bubble-sky" onclick="selectGenre('Thriller')">Thriller</button>
        <button class="bubble bubble-teal" onclick="selectGenre('Drama')">Drama</button>
        <button class="bubble bubble-navy" onclick="selectGenre('Action')">Action</button>
        <button class="bubble bubble-sky" onclick="selectGenre('Fantasy')">Fantasy</button>
      </div>
    </div>

    <!-- Step 2: Shuffle -->
    <div id="step-shuffle" class="screen">
      <h2 style="color: var(--navy);">Shuffling titles...</h2>
      <div id="shuffle-box" class="shuffle-box shuffling">???</div>
    </div>

    <!-- Step 3: Result -->
    <div id="step-result" class="screen">
      <div class="result-card">
        <h2 id="movie-title">Movie Title</h2>
        <div class="movie-meta" id="movie-meta">Year | Rating</div>
        <p class="movie-desc" id="movie-desc">Plot description...</p>
        <div class="watch-box">
          📺 <strong>Where to watch:</strong> <span id="movie-platform">Platform</span>
        </div>
        <button class="btn" onclick="resetApp()">Pick Another Genre</button>
      </div>
    </div>
  </div>

  <script>
    const movieData = {
      "Romcom": [
        { title: "When Harry Met Sally...", year: "1989", rating: "⭐️ 7.7", desc: "Harry and Sally are two friends who strive to stay in a platonic relationship while navigating adult life and romance in NYC.", watch: "Rent on Apple TV / Prime Video" },
        { title: "Crazy Rich Asians", year: "2018", rating: "⭐️ 6.9", desc: "A native New Yorker travels to Singapore to meet her boyfriend's family, only to discover they are extremely wealthy.", watch: "Netflix / HBO Max" },
        { title: "Palm Springs", year: "2020", rating: "⭐️ 7.4", desc: "Two wedding guests get stuck in a recursive time loop while attending a celebration in California.", watch: "Hulu / Prime Video" }
      ],
      "Sci-Fi": [
        { title: "Interstellar", year: "2014", rating: "⭐️ 8.7", desc: "A team of explorers travel through a wormhole in space in an attempt to ensure humanity's survival.", watch: "Paramount+ / Prime Video" },
        { title: "Blade Runner 2049", year: "2017", rating: "⭐️ 8.0", desc: "A young Blade Runner's discovery of a long-buried secret leads him to track down former Blade Runner Rick Deckard.", watch: "Hulu / Apple TV" }
      ],
      "Thriller": [
        { title: "Knives Out", year: "2019", rating: "⭐️ 7.9", desc: "A detective investigates the death of a patriarch of an eccentric, combative family.", watch: "Prime Video" },
        { title: "Prisoners", year: "2013", rating: "⭐️ 8.1", desc: "When Keller Dover's daughter and her friend go missing, he takes matters into his own hands.", watch: "Netflix" }
      ],
      "Drama": [
        { title: "The Shawshank Redemption", year: "1994", rating: "⭐️ 9.3", desc: "Two convicts form a friendship, seeking solace and eventual redemption through basic compassion.", watch: "HBO Max" },
        { title: "Whiplash", year: "2014", rating: "⭐️ 8.5", desc: "A promising young drummer enlists at a cut-throat music conservatory where his instructor pushes him to the limit.", watch: "Hulu / Netflix" }
      ],
      "Action": [
        { title: "Mad Max: Fury Road", year: "2015", rating: "⭐️ 8.1", desc: "In a post-apocalyptic wasteland, a woman rebels against a tyrannical ruler in search for her homeland with the aid of a group of female prisoners.", watch: "Max" },
        { title: "John Wick", year: "2014", rating: "⭐️ 7.4", desc: "An ex-hitman comes out of retirement to track down the gangsters that killed his puppy and took everything from him.", watch: "Peacock" }
      ],
      "Fantasy": [
        { title: "The Lord of the Rings", year: "2001", rating: "⭐️ 8.9", desc: "A meek Hobbit from the Shire and eight companions set out on a journey to destroy the powerful One Ring.", watch: "Max" },
        { title: "Spirited Away", year: "2001", rating: "⭐️ 8.6", desc: "During her family's move to the suburbs, a 10-year-old girl wanders into a world ruled by gods, witches and spirits.", watch: "Max" }
      ]
    };

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function selectGenre(genre) {
      showScreen('step-shuffle');
      const movies = movieData[genre];
      const shuffleBox = document.getElementById('shuffle-box');
      
      let counter = 0;
      const interval = setInterval(() => {
        const randomTemp = movies[Math.floor(Math.random() * movies.length)];
        shuffleBox.innerText = randomTemp.title;
        counter++;

        if (counter > 18) {
          clearInterval(interval);
          const selectedMovie = movies[Math.floor(Math.random() * movies.length)];
          shuffleBox.innerText = selectedMovie.title;
          
          setTimeout(() => {
            displayMovie(selectedMovie);
          }, 800);
        }
      }, 100);
    }

    function displayMovie(movie) {
      document.getElementById('movie-title').innerText = movie.title;
      document.getElementById('movie-meta').innerText = `${movie.year} • ${movie.rating}`;
      document.getElementById('movie-desc').innerText = movie.desc;
      document.getElementById('movie-platform').innerText = movie.watch;
      showScreen('step-result');
    }

    function resetApp() {
      showScreen('step-genre');
    }
  </script>
</body>
</html>
