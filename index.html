<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Picker</title>
</head>
<body>

  <!-- Genre Selection Buttons -->
  <div class="genre-buttons">
    <button onclick="pickMovie('romcom')">Rom-Com</button>
    <button onclick="pickMovie('crime')">Crime</button>
    <button onclick="pickMovie('action')">Action</button>
    <button onclick="pickMovie('comedy')">Comedy</button>
  </div>

  <!-- Movie Result Card -->
  <div id="movie-card">
    <h2 id="movie-title">Pick a genre above!</h2>
    <span id="movie-rating"></span>
    <p id="movie-desc"></p>
    <p id="movie-watch"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
