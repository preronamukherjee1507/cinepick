<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinePick | Find Your Next Flick</title>
  <style>
    /* Color Palette */
    :root {
      --navy: #2F4156;
      --teal: #567C8D;
      --sky-blue: #C8D9E6;
      --beige: #F5EFEB;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--beige);
      color: var(--navy);
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 3rem;
      color: var(--navy);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 1.2rem;
      color: var(--teal);
      font-style: italic;
    }

    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* 8 Bubble Options Layout */
    .bubble-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      margin-top: 25px;
    }

    .bubble {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      color: var(--white);
      font-family: 'Georgia', serif;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      box-shadow: 0 8px 15px rgba(47, 65, 86, 0.2), 
                  inset 0 6px 10px rgba(255, 255, 255, 0.4),
                  inset 0 -6px 10px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      animation: float 4s ease-in-out infinite alternate;
    }

    .bubble:hover {
      transform: scale(1.12) translateY(-5px);
      box-shadow: 0 12px 20px rgba(47, 65, 86, 0.3), 
                  inset 0 8px 12px rgba(255, 255, 255, 0.5),
                  inset 0 -6px 10px rgba(0, 0, 0, 0.2);
    }

    /* Color variations for bubbles */
    .bubble-navy { background-color: var(--navy); }
    .bubble-teal { background-color: var(--teal); }
    .bubble-sky { background-color: var(--sky-blue); color: var(--navy); }
    
    .bubble:nth-child(even) { animation-delay: 0.8s; }
    .bubble:nth-child(3n) { animation-delay: 1.6s; }
    .bubble:nth-child(5n) { animation-delay: 2.4s; }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }

    /* Shuffle Screen */
    .shuffle-box {
      font-size: 1.6rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px dashed var(--teal);
      border-radius: 50%;
      width: 230px;
      height: 230px;
      margin: 30px auto;
      background: var(--sky-blue);
      color: var(--navy);
      padding: 20px;
      box-shadow: 0 10px 20px rgba(47, 65, 86, 0.15);
    }

    .shuffling {
      animation: pulse 0.12s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.96); }
      100% { transform: scale(1.04); }
    }

    /* Movie Result Card */
    .result-card {
      background: var(--white);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(47, 65, 86, 0.15);
      text-align: left;
    }

    .result-card h2 {
      color: var(--navy);
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .movie-meta {
      color: var(--teal);
      font-weight: bold;
      margin-bottom: 15px;
    }

    .movie-desc {
      line-height: 1.6;
      color: var(--navy);
      margin-bottom: 20px;
    }

    .watch-box {
      background: var(--beige);
      padding: 12px 15px;
      border-radius: 10px;
      border-left: 4px solid var(--teal);
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    .btn {
      background: var(--navy);
      color: var(--white);
      border: none;
      padding: 14px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-family: 'Georgia', serif;
      font-size: 1rem;
      width: 100%;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: var(--teal);
    }
  </style>
</head>
<body>

  <header>
    <h1>CinePick</h1>
    <p>Find Your Next Flick</p>
  </header>

  <div class="container">
    <!-- Step 1: 8 Genre Bubbles -->
    <div id="step-genre" class="screen active">
      <h2 style="font-size: 1.3rem; color: var(--navy); letter-spacing: 1px;">CHOOSE YOUR MOVIE TYPE</h2>
      <div class="bubble-container">
        <button class="bubble bubble-navy" onclick="selectGenre('Action')">Action</button>
        <button class="bubble bubble-teal" onclick="selectGenre('Comedy')">Comedy</button>
        <button class="bubble bubble-sky" onclick="selectGenre('Crime')">Crime</button>
        <button class="bubble bubble-teal" onclick="selectGenre('Drama')">Drama</button>
        <button class="bubble bubble-navy" onclick="selectGenre('Horror')">Horror</button>
        <button class="bubble bubble-sky" onclick="selectGenre('Romcom')">RomCom</button>
        <button class="bubble bubble-teal" onclick="selectGenre('Sci-Fi')">Sci-Fi</button>
        <button class="bubble bubble-navy" onclick="selectGenre('Thriller')">Thriller</button>
      </div>
    </div>

    <!-- Step 2: Shuffle Screen -->
    <div id="step-shuffle" class="screen">
      <h2 style="color: var(--navy);">Shuffling titles...</h2>
      <div id="shuffle-box" class="shuffle-box shuffling">???</div>
    </div>

    <!-- Step 3: Result Card -->
    <div id="step-result" class="screen">
      <div class="result-card">
        <h2 id="movie-title">Movie Title</h2>
        <div class="movie-meta" id="movie-meta">Year | Rating</div>
        <p class="movie-desc" id="movie-desc">Plot description...</p>
        <div class="watch-box">
          📺 <strong>Where to watch:</strong> <span id="movie-platform">Platform</span>
        </div>
        <button class="btn" onclick="resetApp()">Pick Another Genre</button>
      </div>
    </div>
  </div>

  <script>
    const movieData = {
      "Action": [
        { title: "Mad Max: Fury Road", year: "2015", rating: "⭐️ 8.1", desc: "In a post-apocalyptic wasteland, a woman rebels against a tyrannical ruler in search for her homeland.", watch: "Max / Rent on Prime Video" },
        { title: "John Wick", year: "2014", rating: "⭐️ 7.4", desc: "An ex-hitman comes out of retirement to track down the gangsters that took everything from him.", watch: "Peacock / Apple TV" },
        { title: "Top Gun: Maverick", year: "2022", rating: "⭐️ 8.3", desc: "After thirty years, Maverick trains a detachment of top aviators for a specialized mission.", watch: "Paramount+ / MGM+" }
      ],
      "Comedy": [
        { title: "Superbad", year: "2007", rating: "⭐️ 7.6", desc: "Two co-dependent high school seniors face separation anxiety while trying to host a party.", watch: "Netflix / Hulu" },
        { title: "The Grand Budapest Hotel", year: "2014", rating: "⭐️ 8.1", desc: "A legendary concierge at a famous European hotel becomes involved in a high-stakes family dispute.", watch: "Hulu / Disney+" },
        { title: "Booksmart", year: "2019", rating: "⭐️ 7.1", desc: "On the eve of high school graduation, two academic superstars attempt to cram four years of fun into one night.", watch: "Peacock / Prime Video" }
      ],
      "Crime": [
        { title: "Pulp Fiction", year: "1994", rating: "⭐️ 8.9", desc: "The lives of two mob hitmen, a boxer, and a gangster's wife intertwine in four tales of violence.", watch: "Max / Paramount+" },
        { title: "The Departed", year: "2006", rating: "⭐️ 8.5", desc: "An undercover cop and a mole in the police attempt to identify each other while infiltrating an Irish gang.", watch: "Prime Video / Apple TV" },
        { title: "Zodiac", year: "2007", rating: "⭐️ 7.7", desc: "A San Francisco cartoonist becomes obsessed with tracking down the elusive Zodiac Killer.", watch: "Paramount+ / Hulu" }
      ],
      "Drama": [
        { title: "The Shawshank Redemption", year: "1994", rating: "⭐️ 9.3", desc: "Two incarcerated men bond over a number of years, finding solace and eventual redemption through compassion.", watch: "Max / Prime Video" },
        { title: "Whiplash", year: "2014", rating: "⭐️ 8.5", desc: "A promising young drummer is pushed to his limits by an abusive music instructor.", watch: "Hulu / Netflix" },
        { title: "Good Will Hunting", year: "1997", rating: "⭐️ 8.3", desc: "A janitor at M.I.T. possesses a genius IQ in mathematics but needs guidance from a therapist to find direction.", watch: "Max / Prime Video" }
      ],
      "Horror": [
        { title: "Get Out", year: "2017", rating: "⭐️ 7.8", desc: "A young man visits his girlfriend's family estate, uncovering a disturbing secret.", watch: "Peacock / Prime Video" },
        { title: "A Quiet Place", year: "2018", rating: "⭐️ 7.5", desc: "A family must live in total silence to hide from blind creatures that hunt by sound.", watch: "Paramount+ / Hulu" },
        { title: "Hereditary", year: "2018", rating: "⭐️ 7.3", desc: "A grieving family is haunted by disturbing secrets following the death of their grandmother.", watch: "Max / Kanopy" }
      ],
      "Romcom": [
        { title: "When Harry Met Sally...", year: "1989", rating: "⭐️ 7.7", desc: "Two friends navigate adult life and romance in NYC while debating whether men and women can remain friends.", watch: "Rent on Apple TV / Prime Video" },
        { title: "Crazy Rich Asians", year: "2018", rating: "⭐️ 6.9", desc: "A New Yorker travels to Singapore to meet her boyfriend's family, discovering they are outrageously wealthy.", watch: "Netflix / Max" },
        { title: "Palm Springs", year: "2020", rating: "⭐️ 7.4", desc: "Two wedding guests become stuck in a time loop while attending a resort celebration.", watch: "Hulu / Prime Video" }
      ],
      "Sci-Fi": [
        { title: "Interstellar", year: "2014", rating: "⭐️ 8.7", desc: "A team of ex-NASA pilots travel through a wormhole to find a habitable planet for humanity.", watch: "Paramount+ / Prime Video" },
        { title: "Blade Runner 2049", year: "2017", rating: "⭐️ 8.0", desc: "An officer unearths a long-buried secret that leads him to search for missing Blade Runner Rick Deckard.", watch: "Hulu / Apple TV" },
        { title: "Arrival", year: "2016", rating: "⭐️ 7.9", desc: "An expert linguist works with the military to communicate with extraterrestrial visitors.", watch: "Paramount+ / Prime Video" }
      ],
      "Thriller": [
        { title: "Knives Out", year: "2019", rating: "⭐️ 7.9", desc: "A suave detective investigates the suspicious death of a wealthy, eccentric mystery author.", watch: "Prime Video / Apple TV" },
        { title: "Prisoners", year: "2013", rating: "⭐️ 8.1", desc: "When two young girls go missing, a desperate father takes matters into his own hands.", watch: "Netflix / Prime Video" },
        { title: "Nightcrawler", year: "2014", rating: "⭐️ 7.8", desc: "A driven man enters the cutthroat world of L.A. freelance crime journalism.", watch: "Starz / Rent on Apple TV" }
      ]
    };

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function selectGenre(genre) {
      showScreen('step-shuffle');
      const movies = movieData[genre];
      const shuffleBox = document.getElementById('shuffle-box');
      
      let counter = 0;
      const interval = setInterval(() => {
        const randomTemp = movies[Math.floor(Math.random() * movies.length)];
        shuffleBox.innerText = randomTemp.title;
        counter++;

        if (counter > 18) {
          clearInterval(interval);
          const selectedMovie = movies[Math.floor(Math.random() * movies.length)];
          shuffleBox.innerText = selectedMovie.title;
          
          setTimeout(() => {
            displayMovie(selectedMovie);
          }, 800);
        }
      }, 100);
    }

    function displayMovie(movie) {
      document.getElementById('movie-title').innerText = movie.title;
      document.getElementById('movie-meta').innerText = `${movie.year} • ${movie.rating}`;
      document.getElementById('movie-desc').innerText = movie.desc;
      document.getElementById('movie-platform').innerText = movie.watch;
      showScreen('step-result');
    }

    function resetApp() {
      showScreen('step-genre');
    }
  </script>
</body>
</html>
