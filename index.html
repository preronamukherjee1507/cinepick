<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Select Genre</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- Rotated Background -->
  <div class="bg-rotated"></div>

  <!-- Dark Overlay -->
  <div class="overlay"></div>

  <!-- Genre Selection UI -->
  <main class="content-container">
    <h1>Select a Genre</h1>
    
    <div class="genre-grid">
      <button class="genre-card" onclick="pickMovie('romance')">Romance</button>
      <button class="genre-card" onclick="pickMovie('comedy')">Comedy</button>
      <button class="genre-card" onclick="pickMovie('true_crime')">True Crime</button>
      <button class="genre-card" onclick="pickMovie('fantasy')">Fantasy</button>
    </div>

    <!-- Area where the shuffling text & selected movie will appear -->
    <div id="movie-display" class="result-box">Click a genre to start!</div>
  </main>

  <!-- External JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
