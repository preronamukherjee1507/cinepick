<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinePick</title>
  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a, #0369a1);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      text-align: center;
      max-width: 800px;
      width: 100%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      padding: 40px 25px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      color: #7dd3fc;
      text-shadow: 0 0 15px rgba(125, 211, 252, 0.4);
    }

    p.subtitle {
      font-size: 1.1rem;
      color: #93c5fd;
      margin-bottom: 35px;
    }

    /* 8 Genre Grid Container */
    .genre-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 35px;
    }

    /* Glossy Bubble Button Styling */
    .bubble-btn {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(37, 99, 235, 0.6));
      border: 2px solid rgba(147, 197, 253, 0.4);
      color: #ffffff;
      padding: 16px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2), inset 0 2px 4px rgba(255, 255, 255, 0.3);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .bubble-btn:hover {
      transform: translateY(-5px) scale(1.03);
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.6), rgba(37, 99, 235, 0.8));
      border-color: #7dd3fc;
      box-shadow: 0 12px 25px rgba(59, 130, 246, 0.5), inset 0 2px 6px rgba(255, 255, 255, 0.5);
    }

    .bubble-btn:active {
      transform: translateY(-1px);
    }

    /* Movie Result Container */
    #movie-display {
      min-height: 160px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 18px;
      padding: 25px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .placeholder-text {
      color: #94a3b8;
      font-size: 1.1rem;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎬 CinePick</h1>
    <p class="subtitle">Pick a genre to unveil your movie choice!</p>

    <!-- The 8 Core Genre Bubble Buttons -->
    <div class="genre-grid">
      <button class="bubble-btn" onclick="pickMovie('action')">💥 Action</button>
      <button class="bubble-btn" onclick="pickMovie('comedy')">😂 Comedy</button>
      <button class="bubble-btn" onclick="pickMovie('crime')">🔍 Crime</button>
      <button class="bubble-btn" onclick="pickMovie('drama')">🎭 Drama</button>
      <button class="bubble-btn" onclick="pickMovie('horror')">👻 Horror</button>
      <button class="bubble-btn" onclick="pickMovie('romcom')">💖 RomCom</button>
      <button class="bubble-btn" onclick="pickMovie('scifi')">🚀 Sci-Fi</button>
      <button class="bubble-btn" onclick="pickMovie('thriller')">⚡ Thriller</button>
    </div>

    <!-- Live Display Box for Shuffling and Final Result -->
    <div id="movie-display">
      <div class="placeholder-text">Click any bubble above to start!</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
